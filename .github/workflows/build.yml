
name: Build Skyline Sports RU

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ru-direct-localization

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4

      - name: Validate UI module syntax
        shell: pwsh
        run: node --check .\\AdditionalSourceFiles\\Skyline_Sports_Project.mjs

      - name: Checkout private game libraries
        uses: actions/checkout@v4
        with:
          repository: Blakosta/CS2-Build-Libraries
          token: ${{ secrets.CS2_LIBRARIES_TOKEN }}
          path: cs2-build-libraries

      - name: Extract game libraries
        shell: pwsh
        run: |
          $archive = Get-ChildItem "$env:GITHUB_WORKSPACE\cs2-build-libraries" -Filter "Managed.zip" -Recurse | Select-Object -First 1
          if (-not $archive) {
            throw "Managed.zip не найден в приватном репозитории."
          }

          $destination = "$env:GITHUB_WORKSPACE\game-managed"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination -Force

          $gameDll = Get-ChildItem $destination -Filter "Game.dll" -Recurse | Select-Object -First 1
          if (-not $gameDll) {
            throw "Game.dll не найден внутри Managed.zip."
          }

          "GAME_MANAGED_DIR=$($gameDll.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Managed directory: $($gameDll.Directory.FullName)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore .\Skyline_Sports_Project.csproj

      - name: Build mod
        shell: pwsh
        run: |
          msbuild .\Skyline_Sports_Project.csproj /m /p:Configuration=Release /p:GameManagedDir="$env:GAME_MANAGED_DIR"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Assemble complete Russian mod package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "Skyline-Sports-RU"
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item ".\bin\Release\net48\Skyline_Sports_Project.dll" $package
          Copy-Item ".\AdditionalSourceFiles\Skyline_Sports_Project.mjs" $package
          Copy-Item ".\AdditionalSourceFiles\Skyline_Sports_Project.css" $package
          Copy-Item ".\AdditionalSourceFiles\images" (Join-Path $package "images") -Recurse -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $package "Logo\Football") | Out-Null
          Copy-Item ".\Logo\Football\RPL" (Join-Path $package "Logo\Football\RPL") -Recurse -Force
          Copy-Item ".\Logo\Football\FNL" (Join-Path $package "Logo\Football\FNL") -Recurse -Force
          Copy-Item ".\Logo\Football\Other" (Join-Path $package "Logo\Football\Other") -Recurse -Force

          @'
          Полная русская сборка мода «Спорт России».
          
          Установка:
          1. Закройте Cities: Skylines II.
          2. Откройте папку установленного мода Skyline_Sports_Project.
          3. Скопируйте сюда ВСЕ файлы и папку images из этого архива, подтвердив замену.
          4. Запустите игру.
          
          В папке мода рядом должны находиться:
          - Skyline_Sports_Project.dll
          - Skyline_Sports_Project.mjs
          - Skyline_Sports_Project.css
          - images/sports.svg
          - Logo/Football/RPL/RPL.cc.svg
          - Logo/Football/RPL/logo/*.cc.svg
          - Logo/Football/FNL/russia_russian-first-league.football-logos.cc.svg
          - Logo/Football/FNL/Logo/*.svg
          - Logo/Football/Other/*.svg
          
          Не устанавливайте только DLL: интерфейсный перевод находится также в MJS-файле.
          '@ | Set-Content -LiteralPath (Join-Path $package "УСТАНОВКА.txt") -Encoding utf8

          Compress-Archive -Path (Join-Path $package "*") -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "Skyline-Sports-RU-Full.zip") -Force

      - name: Upload complete Russian mod package
        uses: actions/upload-artifact@v4
        with:
          name: Skyline-Sports-RU-Full
          path: Skyline-Sports-RU-Full.zip
          if-no-files-found: error

      - name: Upload compiled DLL separately
        uses: actions/upload-artifact@v4
        with:
          name: Skyline-Sports-RU-DLL
          path: bin/Release/net48/Skyline_Sports_Project.dll
          if-no-files-found: error
