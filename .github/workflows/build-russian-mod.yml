name: Build Skyline Sports Russian Mod

on:
  workflow_dispatch:
  push:
    branches:
      - ru-localizer
    paths:
      - 'Skyline_Sports_Project.Engine/**'
      - 'Skyline_Sports_Project/**'
      - 'Skyline_Sports_Project.csproj'
      - '.github/workflows/build-russian-mod.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Russian source
        uses: actions/checkout@v4
        with:
          ref: ru-localizer

      - name: Checkout private CS2 libraries
        uses: actions/checkout@v4
        with:
          repository: Blakosta/CS2-Build-Libraries
          token: ${{ secrets.CS2_LIBRARIES_TOKEN }}
          path: cs2-build-libraries

      - name: Extract Managed libraries
        shell: pwsh
        run: |
          $archive = Get-ChildItem "$env:GITHUB_WORKSPACE\cs2-build-libraries" -Filter "Managed.zip" -Recurse | Select-Object -First 1
          if (-not $archive) { throw "Managed.zip not found in private libraries repository." }
          $destination = "$env:GITHUB_WORKSPACE\game-managed"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination -Force
          $gameDll = Get-ChildItem $destination -Filter "Game.dll" -Recurse | Select-Object -First 1
          if (-not $gameDll) { throw "Game.dll not found in Managed.zip." }
          "GAME_MANAGED_DIR=$($gameDll.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Inspect game assembly versions
        shell: pwsh
        run: |
          Get-ChildItem "$env:GAME_MANAGED_DIR" -Filter "*.dll" | Where-Object { $_.Name -match '^(Game|Unity.Entities|Unity.Mathematics|Colossal.Mathematics|Colossal.Core)\\.dll        uses: microsoft/setup-msbuild@v2

      - name: Restore and build original mod with Russian UI
        shell: pwsh
        run: |
          dotnet restore .\Skyline_Sports_Project.csproj
          msbuild .\Skyline_Sports_Project.csproj /m /p:Configuration=Release /p:GameManagedDir="$env:GAME_MANAGED_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Russian mod DLL
        uses: actions/upload-artifact@v4
        with:
          name: Skyline-Sports-Russian-Mod
          path: bin/Release/net48/Skyline_Sports_Project.dll
          if-no-files-found: error
 } | ForEach-Object { $v = [System.Reflection.AssemblyName]::GetAssemblyName($_.FullName).Version; Write-Host "$($_.Name) $v" }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build original mod with Russian UI
        shell: pwsh
        run: |
          dotnet restore .\Skyline_Sports_Project.csproj
          msbuild .\Skyline_Sports_Project.csproj /m /p:Configuration=Release /p:GameManagedDir="$env:GAME_MANAGED_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Russian mod DLL
        uses: actions/upload-artifact@v4
        with:
          name: Skyline-Sports-Russian-Mod
          path: bin/Release/net48/Skyline_Sports_Project.dll
          if-no-files-found: error
